<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>沖繩・7日行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --ink:#1B2A4A;
    --ocean:#0E7C86;
    --ocean-deep:#0A5B63;
    --lagoon:#5FC9C0;
    --coral:#E8663F;
    --coral-deep:#C94F2C;
    --sand:#FBF6E9;
    --paper:#FFFFFF;
    --line:#D9D2BE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);font-family:'Noto Sans TC',sans-serif;}
  h1,h2,h3,.serif{font-family:'Noto Serif TC',serif;}
  a{color:var(--ocean-deep);}

  /* ================= HERO ================= */
  .hero{
    background:linear-gradient(150deg,var(--ocean-deep) 0%, var(--ocean) 45%, var(--lagoon) 100%);
    color:white; padding:34px 20px 0; position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; right:-60px; bottom:-90px; width:260px; height:260px;
    border-radius:50%; background:rgba(255,255,255,0.08);
  }
  .hero-inner{max-width:1180px; margin:0 auto; position:relative; z-index:1;}
  .hero-eyebrow{font-size:13px; letter-spacing:0.04em; opacity:0.85;}
  .hero-title{font-size:clamp(32px,6vw,52px); font-weight:900; margin:4px 0 6px; line-height:1.05;}
  .hero-sub{font-size:15px; opacity:0.92; margin-bottom:22px;}

  /* boarding-pass day tabs */
  .day-tabs{
    display:flex; gap:0; overflow-x:auto; padding-bottom:0; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; min-width:92px; cursor:pointer; text-align:center;
    padding:12px 14px 16px; border-radius:12px 12px 0 0;
    background:rgba(255,255,255,0.10); color:rgba(255,255,255,0.75);
    border-bottom:none; position:relative; transition:background 0.18s ease, color 0.18s ease;
    border-right:1px dashed rgba(255,255,255,0.25);
  }
  .day-tab:last-child{border-right:none;}
  .day-tab .num{font-family:'Noto Serif TC',serif; font-size:22px; font-weight:700; display:block;}
  .day-tab .wd{font-size:11px; letter-spacing:0.02em; margin-top:2px; display:block;}
  .day-tab.active{background:var(--sand); color:var(--ink);}
  .day-tab.active .num{color:var(--coral-deep);}
  .day-tab .dot{
    width:6px;height:6px;border-radius:50%;background:var(--coral);
    display:inline-block; margin-top:5px; opacity:0;
  }
  .day-tab.has-progress .dot{opacity:1;}

  /* ================= LAYOUT ================= */
  .wrap{max-width:1180px; margin:0 auto; padding:22px 20px 120px;}
  .layout{display:grid; grid-template-columns: 1.25fr 0.95fr; gap:26px; align-items:start;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }

  .panel-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .panel-title h2{font-size:22px; margin:0;}
  .progress-tag{font-size:12.5px; color:var(--ocean-deep); background:rgba(14,124,134,0.09); padding:4px 10px; border-radius:20px;}

  /* ================= TIMELINE ================= */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
  }
  .item{position:relative; padding-bottom:26px;}
  .item:last-child{padding-bottom:4px;}
  .item .stamp{
    position:absolute; left:-26px; top:2px; width:16px; height:16px; border-radius:50%;
    background:var(--paper); border:2px solid var(--ocean); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .item.done .stamp{ background:var(--coral); border-color:var(--coral-deep); }
  .item.done .stamp::after{
    content:"✓"; color:white; font-size:10px; font-weight:700; line-height:1;
  }
  .item .time{font-family:'Noto Serif TC',serif; font-weight:700; font-size:13.5px; color:var(--ocean-deep); letter-spacing:0.02em;}
  .item .place{font-size:17px; font-weight:700; margin:2px 0 4px; cursor:pointer;}
  .item.done .place{ color:#8a8a8a; text-decoration:line-through; text-decoration-color:#c9c2ac; }
  .item .place:hover{ color:var(--ocean-deep); }
  .item .note{font-size:13.5px; color:#4b4b4b; line-height:1.55; margin-bottom:6px;}
  .item .meta-row{display:flex; flex-wrap:wrap; gap:6px 10px; font-size:12.5px;}
  .tag{padding:2px 9px; border-radius:20px; background:#F0EADA; color:#5b5238;}
  .tag.price{background:rgba(232,102,63,0.12); color:var(--coral-deep);}
  .tag.transport{background:rgba(14,124,134,0.10); color:var(--ocean-deep);}
  .item .remark{font-size:12.5px; color:#6b6b6b; margin-top:6px; line-height:1.5; border-left:2px solid var(--line); padding-left:9px;}
  .item .url a{font-size:12.5px;}

  /* ================= MAP PANEL ================= */
  .map-frame{
    background:var(--paper); border:1px solid var(--line); border-radius:4px;
    padding:10px; box-shadow:0 10px 26px rgba(27,42,74,0.10);
  }
  #map{ height:420px; border-radius:2px; }
  @media (max-width:880px){ #map{ height:300px; } }
  .map-caption{font-size:12px; color:#7a7362; margin-top:8px; padding:0 2px;}

  /* wishlist accordion */
  .wishlist{margin-top:30px; border-top:1px solid var(--line); padding-top:18px;}
  .wishlist summary{cursor:pointer; font-family:'Noto Serif TC',serif; font-size:18px; font-weight:700; color:var(--ink); list-style:none; display:flex; align-items:center; gap:8px;}
  .wishlist summary::-webkit-details-marker{display:none;}
  .wishlist summary::before{content:"▸"; color:var(--coral); transition:transform 0.18s ease;}
  .wishlist[open] summary::before{transform:rotate(90deg);}
  .wish-grid{display:grid; grid-template-columns:110px 1fr; gap:9px 16px; margin-top:14px; font-size:13.5px;}
  .wish-grid dt{color:var(--ocean-deep); font-weight:700;}
  .wish-grid dd{margin:0; color:#4b4b4b; line-height:1.6;}

  /* ================= EXPENSE DRAWER ================= */
  .fab{
    position:fixed; right:20px; bottom:20px; z-index:1200;
    background:var(--coral); color:white; border:none; border-radius:30px;
    padding:13px 20px; font-size:14.5px; font-weight:700; font-family:'Noto Sans TC',sans-serif;
    box-shadow:0 8px 20px rgba(201,79,44,0.4); cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .fab:hover{background:var(--coral-deep);}
  .fab .amt{font-family:'Noto Serif TC',serif;}

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(27,42,74,0.35); z-index:1300;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:1400; max-width:640px; margin:0 auto;
    background:var(--paper); border-radius:18px 18px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,0.25);
    transform:translateY(100%); transition:transform 0.3s ease; max-height:82vh; overflow-y:auto;
  }
  .drawer.open{transform:translateY(0);}
  .drawer-head{
    position:sticky; top:0; background:var(--paper); padding:16px 22px 10px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .drawer-head h3{margin:0; font-size:19px;}
  .drawer-close{border:none; background:none; font-size:22px; color:#999; cursor:pointer; line-height:1;}
  .drawer-body{padding:16px 22px 28px;}
  .exp-row{display:grid; grid-template-columns:1fr 130px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid #F0EADA;}
  .exp-row label{font-size:14px;}
  .exp-row .input-wrap{position:relative;}
  .exp-row .input-wrap span{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; color:#999;}
  .exp-row input{
    width:100%; padding:8px 10px 8px 30px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:'Noto Sans TC',sans-serif; text-align:right;
  }
  .exp-row input:focus{outline:none; border-color:var(--ocean);}
  .exp-total{display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; padding-top:14px; border-top:2px solid var(--ink);}
  .exp-total .label{font-size:15px; font-weight:700;}
  .exp-total .value{font-family:'Noto Serif TC',serif; font-size:26px; font-weight:900; color:var(--coral-deep);}
  .exp-hint{font-size:12px; color:#999; margin-top:14px; line-height:1.6;}

  @media (max-width:600px){
    .wrap{padding:18px 14px 110px;}
    .hero{padding:24px 14px 0;}
    .item .place{font-size:16px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">OKINAWA TRIP</div>
    <h1 class="hero-title">沖繩・7日</h1>
    <div class="hero-sub">2026.09.20 — 09.26　那霸 ｜ 宜野灣</div>
    <div class="day-tabs" id="dayTabs"></div>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <div>
      <div class="panel-title">
        <h2 id="dayHeading">Day 1</h2>
        <span class="progress-tag" id="progressTag">0 / 0 已完成</span>
      </div>
      <div class="timeline" id="timeline"></div>

      <details class="wishlist">
        <summary>想去的沖繩景點</summary>
        <dl class="wish-grid">
          <dt>那霸周邊</dt><dd>波上宮、國際通、第一牧志公設市場、首里城、沖繩縣立美術館、屋台村</dd>
          <dt>中部</dt><dd>美國村、中城城、港川外人住宅、PARCO百貨公司</dd>
          <dt>北部</dt><dd>美麗海水族館、古宇利島、萬座毛</dd>
          <dt>其他</dt><dd>瀨長島（龍宮神社、龍神之湯）、浮潛行程</dd>
          <dt>住宿</dt><dd>那霸市區（4晚）／宜野灣（2晚）</dd>
        </dl>
      </details>
    </div>

    <div>
      <div class="map-frame">
        <div id="map"></div>
        <div class="map-caption" id="mapCaption">點選左側地點，地圖會自動定位</div>
      </div>
    </div>
  </div>
</div>

<button class="fab" id="fabExpense">💰 花費　<span class="amt" id="fabTotal">NT$0</span></button>

<div class="drawer-backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>花費記錄</h3>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body">
    <div id="expenseList"></div>
    <div class="exp-total">
      <span class="label">總計</span>
      <span class="value" id="expenseTotal">NT$0</span>
    </div>
    <div class="exp-hint">金額為自行輸入的新台幣估算值，會自動儲存在這台裝置的瀏覽器中，換一台裝置或清除瀏覽資料會重置。</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============== 資料 ============== */
const dayMeta = {
  1: "9/20（日）", 2: "9/21（一）", 3: "9/22（二）", 4: "9/23（三）",
  5: "9/24（四）", 6: "9/25（五）", 7: "9/26（六）"
};

const itinerary = {
  1: [
    { time:"12:00", place:"桃園機場集合", locations:[] },
    { time:"14:50", place:"桃園機場起飛", locations:[] },
    { time:"17:35", place:"抵達那霸機場", remark:"購買OKICA交通卡",
      locations:[{name:"那霸機場",lat:26.2001297,lon:127.6466452}] },
    { time:"飯店", place:"Hewitt Resort Naha（那霸休伊特渡假飯店）", note:"入住（4晚，附早餐）",
      price:"¥64,710／4晚", transport:"坐單軌電車（那霸機場→安里）",
      locations:[{name:"Hewitt Resort Naha",lat:26.2180737,lon:127.695838}] },
    { time:"晚餐", place:"國際通屋台村（居酒屋）",
      locations:[{name:"國際通屋台村",lat:26.2167026,lon:127.690478}] },
  ],
  2: [
    { time:"10:00", place:"波上宮", locations:[{lat:26.2207369,lon:127.6711012}] },
    { time:"12:00", place:"瀨長島", note:"TESHIGOTO手工布包、幸福鬆餅、龍宮神社、龍神之湯",
      locations:[{lat:26.1765465,lon:127.6404145}] },
    { time:"15:00", place:"DMM Kariyushi水族館", note:"09:00～19:00", price:"用FUN PASS",
      locations:[{lat:26.1563877,lon:127.6506782}] },
    { time:"18:00", place:"第一牧志公設市場", note:"08:00～22:00",
      locations:[{lat:26.2145927,lon:127.6883013}] },
    { time:"22:00", place:"早點睡覺，隔天一早要出門！", locations:[] },
  ],
  3: [
    { time:"7:30", place:"一日遊行程", note:"美麗海水族館、古宇利島、萬座毛",
      price:"用KKday套票", transport:"包車／租車", remark:"07:30集合",
      locations:[
        {name:"美麗海水族館",lat:26.694338,lon:127.878013},
        {name:"古宇利島",lat:26.7072982,lon:128.0181686},
        {name:"萬座毛",lat:26.5052353,lon:127.8504781}
      ]},
    { time:"17:15", place:"美國村A", remark:"20:00前要搭公車回飯店",
      locations:[{lat:26.3158768,lon:127.7540067}] },
  ],
  4: [
    { time:"10:00", place:"首里城", locations:[{lat:26.2170449,lon:127.7194833}] },
    { time:"12:00", place:"西來院（達摩寺）", price:"用FUN PASS",
      remark:"需申請Okinawa FunPASS，可現場換開運口金包", url:"https://lihi1.me/CNWOK",
      locations:[{lat:26.2177306,lon:127.7225639}] },
    { time:"14:00", place:"國際通",
      remark:"國際通頭尾分別為單軌電車的「縣廳前站」與「牧志站」，建議採取「一站進、一站出」的單向不回頭走法。",
      locations:[{lat:26.2154644,lon:127.6857013}] },
    { time:"19:00", place:"Echizen越前", note:"螃蟹大餐（美術館附近）", remark:"玠宇已預訂",
      locations:[{lat:26.2272583,lon:127.6985794}] },
  ],
  5: [
    { time:"10:00", place:"換飯店 – 沖繩王子大飯店海景宜野灣", note:"入住（2晚）",
      price:"NT$6,223／2晚", remark:"晚餐自助優惠券（住客限定）",
      locations:[{lat:26.2769526,lon:127.7324471}] },
    { time:"11:30", place:"搭公車／計程車前往潛水地點", transport:"公車要90分鐘／計程車40分鐘", locations:[] },
    { time:"13:00", place:"青洞潛水行程", price:"用KKday套票",
      transport:"兩人以上一起報名 NT$2,580／每人",
      remark:"Q&A、近視超過400度者才需要度數面鏡，如有需要請於訂單註明告知近視度數及數量。",
      url:"https://www.kkday.com/zh-tw/order/show/26KK261764431",
      locations:[{name:"青洞潛水（真栄田岬）",lat:26.4425977,lon:127.7734662}] },
    { time:"晚上", place:"美國村B", locations:[{lat:26.3158768,lon:127.7540067}] },
    { time:"晚上", place:"永旺夢樂城 沖繩來客夢（寶可夢中心）",
      locations:[{lat:26.3145118,lon:127.7965482}] },
  ],
  6: [
    { time:"9:00", place:"A&W 牧港店", note:"美式漢堡", locations:[{lat:26.2666387,lon:127.7284454}] },
    { time:"13:00", place:"中城城", note:"世界遺產", locations:[{lat:26.2835007,lon:127.7996708}] },
    { time:"14:30", place:"港川外人住宅", note:"店家們打烊時間約18:00",
      locations:[{lat:26.2625264,lon:127.714602}] },
    { time:"18:00", place:"PARCO百貨公司", note:"10:00～22:00",
      locations:[{lat:26.2617542,lon:127.6981799}] },
  ],
  7: [
    { time:"10:40", place:"抵達那霸機場", locations:[{lat:26.1985,lon:127.6490}] },
    { time:"13:20", place:"飛機起飛回台灣", locations:[] },
  ],
};

const expenseCategories = [
  { key:"flight", label:"機票", seed:"" },
  { key:"hotel1", label:"住宿（Hewitt Resort Naha）", seed:"" },
  { key:"hotel2", label:"住宿（沖繩王子大飯店）", seed:"6223" },
  { key:"transport", label:"交通（單軌／公車／計程車）", seed:"" },
  { key:"activity", label:"票券／活動（FunPASS、潛水等）", seed:"" },
  { key:"food", label:"餐飲", seed:"" },
  { key:"shopping", label:"購物／伴手禮", seed:"" },
  { key:"other", label:"其他", seed:"" },
];

/* ============== 打勾核對：localStorage ============== */
const DONE_KEY = "okinawa_done_items_v1";
function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY)) || {}; }catch(e){ return {}; } }
function saveDone(obj){ localStorage.setItem(DONE_KEY, JSON.stringify(obj)); }
let doneState = loadDone();

/* ============== 花費：localStorage ============== */
const EXP_KEY = "okinawa_expenses_v1";
function loadExpenses(){
  try{
    const saved = JSON.parse(localStorage.getItem(EXP_KEY));
    if (saved) return saved;
  }catch(e){}
  const init = {};
  expenseCategories.forEach(c => init[c.key] = c.seed);
  return init;
}
function saveExpenses(obj){ localStorage.setItem(EXP_KEY, JSON.stringify(obj)); }
let expenseState = loadExpenses();

/* ============== Day Tabs ============== */
let currentDay = 1;
const dayTabsEl = document.getElementById('dayTabs');

function dayHasProgress(day){
  return itinerary[day].some((_, idx) => doneState[`d${day}-i${idx}`]);
}

function renderDayTabs(){
  dayTabsEl.innerHTML = Object.keys(dayMeta).map(d => {
    const [date, wd] = dayMeta[d].split("（");
    const active = (Number(d) === currentDay) ? "active" : "";
    const hasProg = dayHasProgress(d) ? "has-progress" : "";
    return `<div class="day-tab ${active} ${hasProg}" data-day="${d}">
      <span class="num">${d}</span>
      <span class="wd">${date}</span>
      <span class="dot"></span>
    </div>`;
  }).join("");
  dayTabsEl.querySelectorAll('.day-tab').forEach(el => {
    el.addEventListener('click', () => selectDay(Number(el.dataset.day)));
  });
}

/* ============== Timeline ============== */
const timelineEl = document.getElementById('timeline');
const dayHeadingEl = document.getElementById('dayHeading');
const progressTagEl = document.getElementById('progressTag');

function renderTimeline(day){
  const items = itinerary[day];
  dayHeadingEl.textContent = `Day ${day} ／ ${dayMeta[day]}`;

  let doneCount = 0;
  timelineEl.innerHTML = items.map((it, idx) => {
    const id = `d${day}-i${idx}`;
    const isDone = !!doneState[id];
    if (isDone) doneCount++;

    const metaTags = [];
    if (it.price) metaTags.push(`<span class="tag price">${escapeHtml(it.price)}</span>`);
    if (it.transport) metaTags.push(`<span class="tag transport">${escapeHtml(it.transport)}</span>`);

    return `
      <div class="item ${isDone ? 'done' : ''}" data-id="${id}">
        <div class="stamp" data-action="toggle" data-id="${id}"></div>
        <div class="time">${escapeHtml(it.time || "")}</div>
        <div class="place" data-action="locate" data-idx="${idx}">${escapeHtml(it.place)}</div>
        ${it.note ? `<div class="note">${escapeHtml(it.note)}</div>` : ""}
        ${metaTags.length ? `<div class="meta-row">${metaTags.join("")}</div>` : ""}
        ${it.remark ? `<div class="remark">${escapeHtml(it.remark)}</div>` : ""}
        ${it.url ? `<div class="url"><a href="${it.url}" target="_blank" rel="noopener">🔗 相關連結</a></div>` : ""}
      </div>`;
  }).join("");

  progressTagEl.textContent = `${doneCount} / ${items.length} 已完成`;

  timelineEl.querySelectorAll('[data-action="toggle"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.id;
      doneState[id] = !doneState[id];
      saveDone(doneState);
      renderTimeline(currentDay);
      renderDayTabs();
    });
  });

  timelineEl.querySelectorAll('[data-action="locate"]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.idx);
      focusMapOn(items[idx]);
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============== 地圖 ============== */
const dayColors = {1:"#4E79A7",2:"#F28E2B",3:"#E15759",4:"#76B7B2",5:"#59A14F",6:"#EDC948",7:"#B07AA1"};
const map = L.map('map', { attributionControl:true }).setView([26.35, 127.85], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let dayMarkers = [];
const mapCaption = document.getElementById('mapCaption');

function renderDayMarkers(day){
  dayMarkers.forEach(m => map.removeLayer(m));
  dayMarkers = [];

  const color = dayColors[day];
  const pts = [];
  itinerary[day].forEach(it => {
    (it.locations || []).forEach(loc => {
      const marker = L.circleMarker([loc.lat, loc.lon], {
        radius:9, fillColor:color, color:"#fff", weight:2, fillOpacity:0.95
      }).addTo(map);
      marker.bindTooltip(loc.name || it.place, { direction:"top", offset:[0,-8] });
      marker.bindPopup(`<b>${loc.name || it.place}</b>`);
      dayMarkers.push(marker);
      pts.push([loc.lat, loc.lon]);
    });
  });

  if (pts.length > 0) {
    map.fitBounds(L.latLngBounds(pts), { padding:[36,36], maxZoom:15 });
    mapCaption.textContent = "點選左側地點，地圖會自動定位";
  } else {
    mapCaption.textContent = "這天的行程沒有可標示的地點";
  }
}

function focusMapOn(item){
  if (!item.locations || item.locations.length === 0) return;
  if (item.locations.length === 1) {
    map.setView([item.locations[0].lat, item.locations[0].lon], 15);
  } else {
    map.fitBounds(L.latLngBounds(item.locations.map(l => [l.lat, l.lon])), { padding:[36,36], maxZoom:15 });
  }
  const target = dayMarkers.find(m => {
    const ll = m.getLatLng();
    return item.locations.some(l => Math.abs(l.lat-ll.lat)<1e-6 && Math.abs(l.lon-ll.lng)<1e-6);
  });
  if (target) target.openPopup();
}

/* ============== 切換天數 ============== */
function selectDay(day){
  currentDay = day;
  renderDayTabs();
  renderTimeline(day);
  renderDayMarkers(day);
}

/* ============== 花費 Drawer ============== */
const drawer = document.getElementById('drawer');
const backdrop = document.getElementById('backdrop');
const expenseListEl = document.getElementById('expenseList');
const expenseTotalEl = document.getElementById('expenseTotal');
const fabTotalEl = document.getElementById('fabTotal');

function renderExpenses(){
  expenseListEl.innerHTML = expenseCategories.map(c => `
    <div class="exp-row">
      <label>${c.label}</label>
      <div class="input-wrap">
        <span>NT$</span>
        <input type="number" inputmode="numeric" data-key="${c.key}" value="${expenseState[c.key] || ''}" placeholder="0">
      </div>
    </div>
  `).join("");

  expenseListEl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      expenseState[inp.dataset.key] = inp.value;
      saveExpenses(expenseState);
      updateExpenseTotal();
    });
  });

  updateExpenseTotal();
}

function updateExpenseTotal(){
  let total = 0;
  expenseCategories.forEach(c => {
    const v = parseFloat(expenseState[c.key]);
    if (!isNaN(v)) total += v;
  });
  const formatted = "NT$" + total.toLocaleString();
  expenseTotalEl.textContent = formatted;
  fabTotalEl.textContent = formatted;
}

document.getElementById('fabExpense').addEventListener('click', () => {
  drawer.classList.add('open');
  backdrop.classList.add('open');
});
function closeDrawer(){
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
backdrop.addEventListener('click', closeDrawer);

/* ============== 初始化 ============== */
renderExpenses();
selectDay(1);
</script>
